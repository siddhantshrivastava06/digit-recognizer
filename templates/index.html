<!DOCTYPE html>
<html>
<head>
    <title>Digit Recognizer</title>
</head>
<body>
    <h2>Draw a digit (0-9)</h2>
    <canvas id="canvas" width="140" height="140" style="border:1px solid black;"></canvas>
    <br>
    <button onclick="predict()">Predict</button>
    <button onclick="clearCanvas()">Clear</button>
    <h3 id="result"></h3>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 140, 140);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';

        let drawing = false;
        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, 140, 140);
            document.getElementById('result').innerText = '';
        }

        function predict() {
    const ctxData = ctx.getImageData(0, 0, 140, 140).data;

    let minX = 140, minY = 140, maxX = 0, maxY = 0;
    for (let y = 0; y < 140; y++) {
        for (let x = 0; x < 140; x++) {
            const idx = (y * 140 + x) * 4;
            if (ctxData[idx] > 20) { // non-black pixel = part of the drawing
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }

    if (maxX < minX || maxY < minY) {
        document.getElementById('result').innerText = 'Draw something first.';
        return;
    }

    // add small padding around the bounding box
    const pad = 10;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(140, maxX + pad);
    maxY = Math.min(140, maxY + pad);

    const cropW = maxX - minX;
    const cropH = maxY - minY;

    // crop to a square using the larger dimension, centered
    const side = Math.max(cropW, cropH);
    const cx = minX + cropW / 2;
    const cy = minY + cropH / 2;
    const sqX = cx - side / 2;
    const sqY = cy - side / 2;

    const small = document.createElement('canvas');
    small.width = 8;
    small.height = 8;
    const sctx = small.getContext('2d');
    sctx.fillStyle = 'black';
    sctx.fillRect(0, 0, 8, 8);
    sctx.drawImage(canvas, sqX, sqY, side, side, 0, 0, 8, 8);

    const imgData = sctx.getImageData(0, 0, 8, 8).data;
    const pixels = [];
    for (let i = 0; i < imgData.length; i += 4) {
        const gray = imgData[i];
        pixels.push(Math.round((gray / 255) * 16));
    }

    fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pixels: pixels})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('result').innerText = 'Prediction: ' + data.prediction;
    });
}
    </script>
</body>
</html>
